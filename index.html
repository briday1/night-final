<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>Night Final</title>
<style>
:root{color-scheme:dark;--mono:"Courier New",ui-monospace,monospace;--ink:#ece4d1;--muted:#b0a79a;--gold:#dfb47c}
*{box-sizing:border-box}
body{margin:0;background:#08090b;color:var(--ink);font:16px/1.45 var(--mono);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid #ffdc9f;outline-offset:4px}
[hidden]{display:none!important}
#stage{position:relative;height:100svh;min-height:360px;overflow:hidden;isolation:isolate;--course:#dfb47c}
#room{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;background:#0e1014}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 14vw 1.6vw #0008;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px 5px)}
#stage.hit .vignette{background:#7b211e70}
#stage[data-defense] .vignette{box-shadow:inset 0 0 9vw 1.2vw color-mix(in srgb,var(--course),transparent 75%)}
.utility,.hud,.look-controls,.cue,.trial,.caption{position:absolute;z-index:3}
.utility{top:12px;right:14px;display:flex;gap:6px;z-index:6}
.utility button,.look-controls button,.target,.panel button{border:1px solid #6f675c;border-bottom:3px solid #3a342f;border-radius:0;background:#101216eb;color:#f2e8d7;font-weight:700;text-transform:uppercase;font-size:12px;padding:7px 11px;min-height:39px}
.utility button:hover,.look-controls button:not(:disabled):hover,.target:hover,.panel button:hover{background:#302a26}
.utility button[aria-pressed=true],.look-controls button[aria-pressed=true]{color:var(--course);border-color:var(--course)}
#debug-skip{white-space:nowrap;color:#ffddad;border-color:#9f7756}
.hud{top:12px;left:14px;max-width:calc(100% - 177px);display:flex;flex-wrap:wrap;gap:4px;color:#f0e4d0;text-transform:uppercase;font-size:12px;font-weight:bold;pointer-events:none}
.debug-run .hud{max-width:calc(100% - 315px)}
.debug-run :is(#marks,#misses,#nerve){display:none}
.hud span{padding:6px 8px;background:#0d1014e9;border-bottom:2px solid #4c433a}
.hud .course{color:var(--course);letter-spacing:.06em}
.hud .clock{color:#ffc487}
.hud .danger,.hud .clock.low{color:#ffaaa0;border-color:#b0574d}
.look-controls{bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:5px;width:max-content;max-width:calc(100% - 16px)}
.look-controls button{min-width:70px}
.look-controls button[data-alert],#bridge-look[data-alert]{color:#ffe5c2;border-color:#d88f78;box-shadow:inset 0 0 0 1px #84493e}
.look-controls button:disabled{opacity:.55}
.cue,.caption,.trial{text-align:center;left:50%;transform:translateX(-50%);width:max-content;max-width:min(88%,650px);pointer-events:none}
.cue{top:70px;padding:5px 9px;background:#0c1017dd;margin:0;border-left:2px solid var(--course);font-size:14px;color:#ffdbc0}
.cue[data-alert]{border-color:#d88874;background:#211721f0}
.cue:empty{display:none}
.caption{z-index:4;bottom:12%;margin:0;padding:10px 15px;background:#06090ce8;border-bottom:2px solid var(--course);font-size:clamp(15px,2.2vw,24px);color:#f3e1cb}
.trial{top:75px;color:#eee3d5;text-shadow:2px 2px #0b0b11;font-size:14px}
.trial strong{display:inline-block;padding:4px 9px;border:1px solid #746852;background:#121319f2;color:var(--course);text-transform:uppercase;letter-spacing:.14em}
.trial p{margin:6px auto;max-width:510px;padding:4px 8px;background:#0b0d11c9}
#trial-score{color:var(--course);font-weight:bold;font-size:13px}
.target{position:absolute;z-index:3;transform:translate(-50%,-50%);min-width:48px;min-height:48px;padding:5px;border:1px solid #a59d82;background:#11101835;text-shadow:1px 2px #161013;touch-action:none}
.target[data-lit],.target[data-held]{color:#ffe5ac;background:#86704a75;box-shadow:inset 0 0 0 2px #ffe3a1;border-color:#f9d391}
.target[data-ready]{background:#374737;border-color:#b2d9aa}
.target:disabled{opacity:.56}
#stage[data-trial=beam] #room,#stage[data-trial=orrery] #room{cursor:crosshair}
#stage[data-trial=breath] .target{min-width:112px}
.paper{position:absolute;top:0;left:0;transform-origin:0 0;z-index:2;width:540px;height:464px;
  display:flex;flex-direction:column;padding:26px 32px 22px;color:#2b2725;
  background:repeating-linear-gradient(0deg,#754c4221 0 1px,transparent 1px 24px),#e0cead;
  border:2px solid #8e7757;box-shadow:inset 0 0 0 4px #ccb793;
  color-scheme:light;font:18px/1.25 var(--mono)}
.paper[inert]{pointer-events:none}
.paper-head{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #876957;padding-bottom:6px;font-weight:bold;text-transform:uppercase;font-size:15px;color:#6e423e}
.paper .note{font-size:14px;margin:5px 0 0;color:#71564c}
.paper h2{font:700 22px/1.17 var(--mono);margin:14px 0 8px}
.paper .plate{display:grid;place-items:center;background:#bba68424;height:89px;flex:none;border-bottom:1px solid #ae9175}
.plate svg{display:block;height:85px;width:100%;shape-rendering:geometricPrecision}
.plate .ink{fill:#ad9273;stroke:#624b45;stroke-width:2}.plate .bone{fill:#b49b7d;stroke:#6f544a;stroke-width:2}
.plate .mane{fill:#735347;stroke:#5c433b;stroke-width:1.5}.plate .coat-light{fill:#ceb28b;stroke:#a58366;stroke-width:1.5}
.plate .detail{fill:none;stroke:#7b5b4d;stroke-width:2}.plate text{fill:#785749;text-anchor:middle;font:10px var(--mono)}
.paper .answers{display:grid;align-content:center;gap:2px;flex:1}
.paper button{font:700 17px/1.17 var(--mono);border:0;border-radius:0;color:inherit;background:none;min-height:37px;text-align:left}
.paper button:focus-visible{outline:2px dashed #734630;outline-offset:1px}
.paper .answers button{position:relative;padding:6px 28px 6px 7px;border-bottom:1px dashed #a48770}
.paper:has(.plate:not([hidden])) .answers button{min-height:33px;padding-block:4px}
.paper button:not(:disabled):hover{background:#aa72582b}
.paper button[data-mark=right]{color:#244a32;background:#b5c69a}
.paper button[data-mark=wrong]{color:#862f30;background:#cc9981;text-decoration:line-through;text-decoration-thickness:2px}
.paper button[data-mark]::after{position:absolute;right:7px;top:50%;transform:translateY(-50%);text-decoration:none}
.paper button[data-mark=right]::after{content:'✓'}
.paper button[data-mark=wrong]::after{content:'×'}
.paper button[data-mark=key]{color:#31583f}
.paper-foot{display:flex;align-items:center;gap:7px;min-height:46px;border-top:2px solid #9a805f;margin-top:5px}
.paper-foot span{flex:1;font-weight:bold;font-size:15px;color:#613c39}
.paper-foot button{padding:7px 10px;border-bottom:2px solid #304031;background:#324b39;color:#fff4d8;text-align:center}
.paper-foot button:disabled{opacity:.35}
.paper progress{appearance:none;border:0;width:100%;height:5px;background:#b8a37f;accent-color:#824238}
.paper progress::-webkit-progress-bar{background:#b8a37f}
.paper progress::-webkit-progress-value{background:#824238}
.paper progress::-moz-progress-bar{background:#824238}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;padding:60px 24px 30px;background:#080a0ce6}
.panel{width:min(100%,610px);padding:clamp(18px,4vw,36px);border:1px solid #89776b;border-left:4px solid #b19175;background:#12141aea;box-shadow:7px 7px #030407;color:#ece4d3}
.panel .eyebrow{color:#ccab8b;text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:bold}
.panel h1{margin:8px 0 14px;font:900 clamp(25px,5vw,48px)/1 var(--mono);text-transform:uppercase;letter-spacing:-.08em}
.panel p,.panel li{margin:8px 0 13px}
.panel a{color:#edd0a1}
.panel button{margin-top:8px}
.panel .primary{background:#c9a17c;border-color:#e5b990;color:#17121a;box-shadow:inset 0 -3px #956b52}
.panel .primary:hover{background:#ebc3a0}
.overlay[data-screen=title]{place-items:center start;padding:clamp(22px,7vw,108px);background:linear-gradient(90deg,#07080bf7 0%,#07080bed 26%,#07080b8a 52%,#07080b16 88%)}
.overlay[data-screen=title] .panel{border:0;background:none;box-shadow:none;padding:0}
.title-number{color:#ebac84;font-weight:bold;letter-spacing:.24em}
.panel .wordmark{font:900 clamp(52px,10vw,160px)/.80 var(--mono);letter-spacing:-.115em;margin:24px 0 26px;color:#f0dec6;text-shadow:4px 6px #472b38}
.title-copy{color:#d1bbaa;max-width:340px;font-size:15px}
.title-actions{display:grid;gap:6px;width:min(100%,260px);margin-top:26px}
.title-actions button{text-align:left}
.title-footer{margin-top:24px;font-size:11px;color:#b9a8aa;letter-spacing:.16em}
.notes{max-height:56svh;overflow:auto;padding-right:8px}
.notes h2{color:var(--gold);font-size:16px}
.notes details{border-top:1px solid #51473f;padding:7px 0;font-size:13px}
.notes summary{cursor:pointer;color:#ecd1a6;font-weight:bold}
.gradebook{list-style:none;margin:0;padding:0;font-size:14px}
.gradebook li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #5a4946;padding:5px 0;margin:0}
.gradebook strong{color:#efc09d}
#stage:not(.in-run) .hud,#stage:not(.in-run) .look-controls,#stage:not(.in-run) #pause{display:none}
#stage.cinema .utility,#stage.cinema .hud{display:none}
#stage[data-view=desk] .look-controls button{background:#151318f5}
@media(max-width:650px){
  .utility{top:7px;right:7px;gap:3px}.utility button{padding:5px 6px;font-size:10px;min-height:34px}
  .hud{top:7px;left:7px;max-width:calc(100% - 120px);font-size:10px}.hud span{padding:4px 6px}
  .debug-run .hud{max-width:calc(100% - 120px)}
  #debug-skip{position:absolute;top:calc(100% + 3px);right:0}
  .look-controls{bottom:9px;gap:3px}.look-controls button{min-width:0;padding:5px 7px;font-size:11px;min-height:39px}
  .cue{top:85px;font-size:12px}.trial{top:84px;font-size:12px}.trial p{line-height:1.25}.trial strong{font-size:12px}
  .overlay[data-screen=title]{background:linear-gradient(180deg,#07080be8,#07080b36 64%,#07080be6);place-items:center}
}
@media(max-height:510px){
  .utility,.hud{top:5px}.cue,.trial{top:54px}.trial p{margin:3px 0}.panel .wordmark{font-size:clamp(45px,12vh,100px)}
  .overlay{padding-top:42px}.overlay[data-screen=title]{padding:22px 7vw}
}
@media(max-width:650px) and (max-height:510px){.debug-run .cue{top:81px}}
@media(prefers-reduced-motion:reduce){.vignette{background:none}#stage.hit .vignette{background:#68241f40}}

.beam-dodge,.bridge-control{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;
  max-width:calc(100% - 20px);color:#f1e2d1;text-align:center}
.beam-dodge{bottom:66px;display:flex;gap:4px}
.beam-dodge button,.bridge-control button{border:1px solid #8b7666;border-bottom:4px solid #3d2c31;border-radius:0;
  background:#201c25;color:#f6e3cd;padding:8px 13px;min-height:42px;font-size:13px;font-weight:bold;text-transform:uppercase}
.beam-dodge button[aria-pressed=true]{color:#ffe6b8;background:#544153;border-color:#d49da5}
#pump,#seal-vent{background:#483b31;color:#ffe3ae;border-color:#af8664;border-bottom-color:#553d36}
#pump[data-stroking]{transform:translateY(2px);background:#6b5136}
#pump[data-alert]{background:#6d3f38;border-color:#efa88b}
.room-readout{margin:0 0 5px;padding:2px 8px;background:#10151ce8;color:var(--course);font-weight:bold;font-size:12px}
#bridge-steps{display:flex;gap:5px;justify-content:center;margin-bottom:3px}
#bridge-steps button[data-braced]{background:#4a3c30;color:#ffe1a1;border-color:#bd9668;border-bottom-color:#674c39}
#bridge-steps button[data-wave=warning]{background:#674331;border-color:#eca26b;color:#fff0bb}
#bridge-steps button[data-wave=washed]{background:#242837;border-color:#766b86;color:#c4b3c9;text-decoration:line-through}
#bridge-steps button:disabled,#bridge-back:disabled{opacity:.42}
#bridge-back,#bridge-look{padding:3px 10px;min-height:34px;font-size:11px}
#water-on-paper{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#water-on-paper::after{position:absolute;content:"";inset:auto 0 0;height:var(--water);background:linear-gradient(#8ed2d48a,#174b679e);
  border-top:3px solid #e5fbdf8f;box-shadow:0 -4px 12px #5ad8d65a}
#root-web,#root-knots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#root-web{z-index:3;overflow:visible}
#root-web path{fill:none;stroke:#825065;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;
  filter:drop-shadow(2px 3px #392038)}
#root-knots{z-index:4}
.paper .root-knot{position:absolute;min-width:58px;height:55px;min-height:55px;border:2px solid #d69274;text-align:center;
  color:#ffe7ae;background:#763f54;box-shadow:inset 0 0 0 4px #4c2939,3px 3px #352439;pointer-events:auto;
  clip-path:polygon(18% 0,77% 0,100% 27%,100% 76%,78% 100%,22% 100%,0 73%,0 21%)}
.paper .root-knot:hover,.paper .root-knot:focus-visible{background:#a95864;color:#fff2b9}
.paper .root-knot.urgent{border-color:#ffe6ae;background:#a94d56;box-shadow:inset 0 0 0 4px #6b3349,0 0 9px #ecb78c}
.root-knot:nth-child(1){top:10px;left:-23px}.root-knot:nth-child(2){top:10px;right:-23px}
.root-knot:nth-child(3){bottom:20px;left:-23px}.root-knot:nth-child(4){bottom:20px;right:-23px}
#circuit{background:repeating-linear-gradient(0deg,#0000 0 18px,#08080b21 19px),#2d2638;color:#f1d3b4;
  border:3px solid #74536e;box-shadow:inset 0 0 0 4px #171623,0 7px #171522;padding:23px 27px 19px;
  justify-content:space-between;align-items:center;gap:8px}
#circuit .paper-head{align-self:stretch;color:#e6bda8;border-color:#87647b}
#circuit-state{font-size:16px;text-align:center;margin:0;color:#e7c8b0}
#circuit[data-powered] #circuit-state{color:#c5f2bd}
.circuit-tray{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
#circuit-grid{display:grid;grid-template-columns:repeat(3,84px);gap:2px;padding:4px;background:#191522;border:2px solid #836778}
.circuit-end{position:absolute;display:grid;place-items:center;min-width:73px;color:#f2c6a9;background:#191522;border:2px solid #8e657d;
  font-size:12px;text-transform:uppercase;font-weight:700;padding:8px 5px}
.circuit-end.source{right:calc(100% - 1px);top:31px;border-right:2px solid #e2af77}
.circuit-end.anchor{left:calc(100% - 1px);bottom:31px;border-left:2px solid #aa8bb6}
#circuit[data-powered] .circuit-end.anchor{border-color:#d2e6a9;color:#d9efb8}
#circuit-grid button{position:relative;aspect-ratio:1;display:grid;place-items:center;border:0;padding:0;min-height:0;
  background:#493b50;color:#dcc3b5;box-shadow:inset 0 0 0 1px #6a5568}
#circuit-grid button:hover,#circuit-grid button:focus-visible{background:#625166}
#circuit-grid button[data-powered]{background:#50444c;color:#ffe9ac}
#circuit-grid svg{width:100%;height:100%}
#circuit-grid path{fill:none;stroke:#ad866e;stroke-width:6}
#circuit-grid circle{fill:#8c705e}
#circuit-grid [data-powered] path{stroke:#f7d491;filter:drop-shadow(0 0 3px #eaa575)}
#circuit-grid [data-powered] circle{fill:#ffe2aa}
#circuit-grid span{position:absolute;left:6px;top:3px;font-size:13px;font-weight:bold}
.circuit-hint{margin:0;font-size:13px;color:#cfafbc}
.circuit-hint.urgent{color:#ffac83;font-weight:bold}
@media(max-width:650px){.beam-dodge{bottom:55px}.bridge-control{bottom:7px}.room-readout{font-size:11px}}
</style>
</head>
<body>
<main id="stage">
  <canvas id="room" width="576" height="324" aria-label="First-person view of the exam room"></canvas>
  <div class="vignette"></div>
  <div class="hud" aria-label="Exam status">
    <span class="course" id="course"></span><span class="clock" id="clock"></span><span id="marks"></span><span id="misses"></span><span id="nerve"></span><span id="water-gauge" hidden></span>
  </div>
  <div class="utility"><button id="sound" type="button" aria-pressed="true">Sound on</button><button id="pause" type="button">Pause</button>
    <button id="debug-skip" type="button" aria-keyshortcuts="N" title="Skip questions (N)" hidden>Skip questions</button>
  </div>
  <section class="paper" id="paper" aria-label="Exam paper" hidden>
    <div class="paper-head"><span id="packet"></span><span id="item"></span></div>
    <p class="note" id="paper-note">One mark per question.</p>
    <h2 id="question"></h2>
    <div id="plate" class="plate" hidden></div>
    <div class="answers" id="answers"></div>
    <div class="paper-foot"><span id="paper-status" role="status"></span><button id="next" type="button">Next</button></div>
    <progress id="writing" max="1" value="0" aria-label="Writing progress"></progress>
    <div id="water-on-paper" aria-hidden="true" hidden></div>
    <svg id="root-web" viewBox="0 0 540 464" aria-hidden="true" hidden>
      <path pathLength="1" d="M6 38L55 61L62 97L126 122L106 155L209 182L193 217L327 245L381 296L451 309"/>
      <path pathLength="1" d="M534 38L483 67L466 104L397 117L390 173L301 181L288 229L179 247L137 289L76 299"/>
      <path pathLength="1" d="M6 410L68 383L78 345L146 328L149 290L227 283L243 248L347 219L419 181L477 160"/>
      <path pathLength="1" d="M535 409L474 376L462 339L397 337L380 295L300 278L275 236L173 213L118 170L67 161"/>
    </svg>
    <div id="root-knots" hidden>
      <button class="root-knot" type="button" aria-label="Cut the upper left root, Q" hidden>Q</button>
      <button class="root-knot" type="button" aria-label="Cut the upper right root, E" hidden>E</button>
      <button class="root-knot" type="button" aria-label="Cut the lower left root, Z" hidden>Z</button>
      <button class="root-knot" type="button" aria-label="Cut the lower right root, C" hidden>C</button>
    </div>
  </section>
  <section class="paper" id="circuit" aria-label="Desk tether circuit" hidden>
    <div class="paper-head"><span>Desk tether · Junction plate</span><span id="circuit-count"></span></div>
    <p id="circuit-state" role="status"></p>
    <div class="circuit-tray">
      <span class="circuit-end source">Source →</span>
      <div id="circuit-grid" aria-label="Rotating circuit tiles">
        <button type="button"></button><button type="button"></button><button type="button"></button>
        <button type="button"></button><button type="button"></button><button type="button"></button>
        <button type="button"></button><button type="button"></button><button type="button"></button>
      </div>
      <span class="circuit-end anchor">→ Anchor</span>
    </div>
    <p class="circuit-hint" id="circuit-hint">Tap tiles or use keys 1–9.</p>
  </section>
  <p class="cue" id="cue" role="status"></p>
  <div class="beam-dodge" id="beam-dodge" aria-label="Lean away from the beam" role="group" hidden>
    <button id="lean-left" type="button" aria-keyshortcuts="1" aria-pressed="false">← Lean left · 1</button>
    <button id="lean-right" type="button" aria-keyshortcuts="2" aria-pressed="false">Lean right · 2 →</button>
  </div>
  <div class="bridge-control" id="bridge-control" hidden>
    <p class="room-readout" id="bridge-progress"></p>
    <div id="bridge-steps" aria-label="Step onto the next plank">
      <button type="button">A · Left</button><button type="button">W · Center</button><button type="button">D · Right</button>
    </div>
    <button id="bridge-back" type="button">S · Step back</button>
    <button id="bridge-look" type="button" aria-keyshortcuts="R">Walker · R</button>
  </div>
  <nav class="look-controls" id="controls" aria-label="Look controls">
    <button type="button" data-view="left">← Window</button>
    <button type="button" data-view="front">↑ Hall</button>
    <button type="button" data-view="right">→ Wall</button>
    <button id="look-desk" type="button" data-view="desk">↓ Desk</button>
    <button id="inspect" type="button" data-view="up" aria-keyshortcuts="R" hidden>Ceiling · R</button>
    <button id="pump" type="button" aria-keyshortcuts="E" hidden>Walk to pump · E</button>
    <button id="seal-vent" type="button" aria-keyshortcuts="F" hidden>Shutter · F</button>
  </nav>
  <section class="trial" id="trial" aria-label="Practical exam" hidden>
    <strong id="trial-title"></strong><p id="trial-brief"></p><p id="trial-score" role="status"></p>
  </section>
  <div id="targets"><button type="button" class="target" hidden></button><button type="button" class="target" hidden></button><button type="button" class="target" hidden></button></div>
  <p class="caption" id="caption" role="status" hidden></p>
  <div class="overlay" id="overlay"><section class="panel" id="panel"></section></div>
</main>
<script src="curriculum.js"></script>
<script src="proctor-art.js"></script>
<script src="game.js"></script>
<script src="room-play.js"></script>
<script src="room-scene.js"></script>
<script src="scene.js"></script>
</body>
</html>
