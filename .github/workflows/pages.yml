name: Deploy Night Final

on:
  push:
    branches: [main]
    paths:
      - index.html
      - '*.js'
      - package.json
      - tools/build.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build the browser game
        run: |
          npm run check
          npm run package:web
          mkdir -p dist/pages
          cp dist/Night-Final.html dist/pages/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
